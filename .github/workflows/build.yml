name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Music Stuff-Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Test and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug -Pmusicstuff.modules=app

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/Music Stuff-Android.apk"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Music Stuff-Android
          path: out/Music Stuff-Android.apk

  windows:
    name: Music Stuff-Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Build installer
        shell: bash
        run: ./gradlew :desktop:packageExe -Pmusicstuff.modules=desktop

      - name: Name the installer
        shell: bash
        run: |
          mkdir -p out
          cp desktop/build/compose/binaries/main/exe/*.exe "out/Music Stuff-Windows.exe"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Music Stuff-Windows
          path: out/Music Stuff-Windows.exe
          compression-level: 0

  linux:
    name: Music Stuff-Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Build package and portable app
        run: ./gradlew :desktop:packageDeb :desktop:createDistributable -Pmusicstuff.modules=desktop

      - name: Name the builds
        run: |
          mkdir -p out
          cp desktop/build/compose/binaries/main/deb/*.deb "out/Music Stuff-Linux.deb"
          tar -czf "out/Music Stuff-Linux.tar.gz" -C desktop/build/compose/binaries/main/app .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Music Stuff-Linux
          path: |
            out/Music Stuff-Linux.deb
            out/Music Stuff-Linux.tar.gz
          compression-level: 0

  macos:
    name: Music Stuff-MacOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Build disk image and app
        run: ./gradlew :desktop:packageDmg :desktop:createDistributable -Pmusicstuff.modules=desktop

      - name: Name the builds
        run: |
          mkdir -p out
          cp desktop/build/compose/binaries/main/dmg/*.dmg "out/Music Stuff-MacOS.dmg"
          ditto -c -k --keepParent desktop/build/compose/binaries/main/app/*.app "out/Music Stuff-MacOS.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Music Stuff-MacOS
          path: |
            out/Music Stuff-MacOS.dmg
            out/Music Stuff-MacOS.zip
          compression-level: 0

  ios:
    name: Music Stuff-IOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-debug-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Build the Kotlin framework
        run: ./gradlew :ios:linkDebugFrameworkIosArm64 -Pmusicstuff.modules=ios --build-cache "-Dorg.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m"

      - name: Generate the Xcode project
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          cd iosApp && "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --quiet

      - name: Build the app
        run: |
          cd iosApp
          set -o pipefail
          xcodebuild -quiet -project MusicStuff.xcodeproj -target MusicStuff -configuration Release -sdk iphoneos -jobs 8 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SWIFT_ENABLE_EXPLICIT_MODULES=NO build 2>&1 | tee xcodebuild.log \
            || { grep -E "error:|fatal error|Undefined symbol|ld:" xcodebuild.log | head -60; exit 1; }

      - name: Package the IPA
        run: |
          mkdir -p out/Payload
          cp -R "iosApp/build/Release-iphoneos/Music Stuff.app" out/Payload/
          cd out && zip -qr "Music Stuff-IOS.ipa" Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Music Stuff-IOS
          path: out/Music Stuff-IOS.ipa
          compression-level: 0
